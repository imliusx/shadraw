services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shadraw
      POSTGRES_PASSWORD: shadraw
      POSTGRES_DB: shadraw
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadraw -d shadraw"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      LOG_LEVEL: info
      DB_DSN: postgres://shadraw:shadraw@db:5432/shadraw?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATA_DIR: /app/data
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
